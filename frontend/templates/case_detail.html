<!DOCTYPE html>
<html>
<head>
<title>Case Details</title>
<link type="text/css" href="{{ url_for('static', path='/css/main.css') }}" rel="stylesheet"/>
<script type="module" src="{{ url_for('static', path='/js/firebase-login.js')}}"></script>
</head>
<body>
<div id="login-box" hidden="true">
        Email:<input type="email" name="" id="email"/><br/>
        Password:<input type="password" name="" id="password"/>
<button id="login">Login</button>
<button id="sign-up">Sign Up</button>
</div>
<button id="sign-out" hidden="true">Sign out</button>
<h1>Case Details</h1>
<p><strong>Case ID:</strong> {{ case.id }}</p>
<p><strong>Patient Label:</strong> {{ case.patient_label }}</p>
<p><strong>Created At:</strong> {{ case.created_at }}</p>
<a href="/">Back to Cases</a>
</body>
</html>
