{% extends "base.html" %}
{% block title %}New Case · Cygnus{% endblock %}
{% block content %}
<div class="d-flex justify-content-center">
    <div class="card p-4" style="max-width: 420px; width: 100%;">
        <h1 class="h4 mb-3">New Case</h1>
        <form action="/cases/new" method="post">
            <div class="mb-3">
                <label class="form-label">Patient / case label</label>
                <input type="text" name="patient_label" class="form-control" placeholder="e.g. R knee, acute" required>
            </div>
            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Case</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
